services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbudget}
      POSTGRES_DB: ${POSTGRES_DB:-smartbudget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbudget} -d ${POSTGRES_DB:-smartbudget}"]
      interval: 20s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "24mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SMARTBUDGET_BACKEND_BIND:-127.0.0.1}:8000:8000"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - ./backend/.env
    environment: &compose-backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartbudget}:${POSTGRES_PASSWORD:-smartbudget}@postgres:5432/${POSTGRES_DB:-smartbudget}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "src.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment: *compose-backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SMARTBUDGET_BIND_HOST:-127.0.0.1}:${SMARTBUDGET_FRONTEND_PORT:-3001}:3000"
    environment:
      NUXT_API_ORIGIN: http://backend:8000
      NODE_OPTIONS: "--max-old-space-size=160"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:3000/auth/login"]
      interval: 30s
      timeout: 8s
      start_period: 15s
      retries: 5

volumes:
  pgdata:
  redisdata:
