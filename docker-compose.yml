services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartbudget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbudget}
      POSTGRES_DB: ${POSTGRES_DB:-smartbudget}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartbudget} -d ${POSTGRES_DB:-smartbudget}"]
      interval: 15s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SMARTBUDGET_BACKEND_BIND:-127.0.0.1}:8000:8000"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - ./backend/.env
    environment: &compose-backend-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-smartbudget}:${POSTGRES_PASSWORD:-smartbudget}@postgres:5432/${POSTGRES_DB:-smartbudget}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "src.worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment: *compose-backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SMARTBUDGET_BIND_HOST:-127.0.0.1}:${SMARTBUDGET_FRONTEND_PORT:-3001}:3000"
    environment:
      NUXT_API_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/auth/login"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  pgdata:
  redisdata:
